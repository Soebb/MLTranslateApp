plugins {
    id 'com.android.application'
}
android {
    namespace 'com.example.tempapplication'
    defaultConfig {
        applicationId "com.example.tempapplication"
        minSdk 24
        compileSdk 36
        targetSdk 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures{
        viewBinding true
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

def mlkitOCRLanguages = [
        "chinese",
        "devanagari",
        "japanese",
        "korean",
]

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.18.0'
    // UI
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.7'
    implementation 'androidx.activity:activity:1.13.0'
    // ViewModel / Coroutines
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    // translate
    implementation 'com.google.mlkit:translate:17.0.3'
    // language detection
    implementation 'com.google.mlkit:language-id:17.0.6'
    // text detection
    implementation "com.google.mlkit:text-recognition:16.0.1" // this is for latin
    mlkitOCRLanguages.each { lang ->
        implementation "com.google.mlkit:text-recognition-${lang}:16.0.0"
    }
    // image cropper ( text recognition works without this too)
    implementation("com.vanniktech:android-image-cropper:4.7.0")

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
